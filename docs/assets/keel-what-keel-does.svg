  <g transform="translate(105 1290)"><path d="M0 0H990" stroke="#343c45" stroke-width="1"/><text x="0" y="42" fill="#727b85" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="3.1">ENGINEERING PRINCIPLE</text><text x="0" y="82" fill="#f0f2f3" font-family="Inter,Arial,sans-serif" font-weight="600" font-size="24">The agent does not define “done”. The contract does.</text><text x="0" y="112" fill="#828b94" font-family="Inter,Arial,sans-serif" font-size="14">Approval gates the implementation. Review can return work to code. Verification decides whether the task is actually complete.</text></g>
