<text x="800" y="744" text-anchor="middle" class="h2 white">03  CONTROLLED AI ENGINEERING ENVIRONMENT</text>
<text x="800" y="769" text-anchor="middle" class="body muted">Reliable  ·  Predictable  ·  Auditable  ·  Production-Ready</text>

