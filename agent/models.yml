# ~/.omp/agent/models.yml - provider/model config (verified shape, omp 17.3.x)
#
# OpenRouter is a BUILT-IN provider, so you usually do NOT need a custom provider block - just
# reference `openrouter/<modelId>` in config.yml modelRoles and in agents/coder.md. Set your
# OpenRouter key with `/login` inside an omp session, or via the OPENROUTER_API_KEY env var.
# (Credentials are stored in agent.db, separate from config.yml - replacing config.yml never
# touches them. There is no `omp login` CLI command.)
#
# Only define `providers:` if you use a NON-catalog endpoint. A custom provider REQUIRES apiKey
# (an env var NAME), else it is disabled and role names fuzzy-match the catalog -> wrong model / 404.
# So either use the built-in openrouter provider (recommended) or give a real apiKey below.
#
# Recommended: leave this file effectively empty and rely on the built-in catalog.
# Example custom provider (only if you truly need one):
#
# providers:
#   my-openrouter:
#     baseUrl: https://openrouter.ai/api/v1
#     apiKey: OPENROUTER_API_KEY      # the NAME of the env var, not the key itself
#     api: openai-completions
#     auth: apiKey
#     disableStrictTools: false        # true only for endpoints that reject strict tools
